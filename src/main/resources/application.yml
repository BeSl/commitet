# application.yml
app:
  version: 1.0.7
  onelogpath: ../test
  v8unpack: v8unpack.exe
  # Рабочий каталог для клонирования репозиториев проектов
  workdir: ./repos
  # Рабочий каталог для запуска внешних команд
  shell-workdir: .

server:
  port: 8090
  servlet:
    session:
      timeout: 43200s
      cookie:
        max-age: 43200

logging:
  level:
    root: INFO
    com.besl: INFO

spring:
  ai:
    ollama:
      chat:
        model: qwen3:14b
    ollama.base-url: http://localhost:11434
  # Параметры подключения к брокеру RabbitMQ (используются только при commit.rabbitmq.enabled=true)
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}

jmix:
  ui:
    view-file-extensions:
      - htm
      - html
      - jpg
      - png
      - jpeg
      - pdf

# Git configuration
# Учётные данные берутся из переменных окружения; значения по умолчанию — для локальной разработки
git:
  timeout: 20
  user: ${GIT_USER:test}
  token: ${GIT_TOKEN:test}

# Чтение коммитов внешних обработок из очереди RabbitMQ.
# По умолчанию выключено: приложение стартует без брокера.
commit:
  rabbitmq:
    enabled: false
    queue: commitet.commits
    concurrency: 1
    max-concurrency: 1

